[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookspine"
version = "0.1.0"
description = "Proof-of-concept paragraph-level EPUB structure/Locator extraction service (see Reading Assistant Blueprint §05/§07)"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.2",
    "click>=8.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bookspine = "bookspine.cli:main"

[tool.setuptools.packages.find]
include = ["bookspine*"]
